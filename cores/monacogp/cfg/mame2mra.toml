[global]
author=["Andrea Bogazzi"]
overrule=[{rotate=270}]

[parse]
sourcefile=["monacogp.cpp"]

[buttons]
names=[{names="Accelerate,Gear,Scoreboard"}]

[dipsw]
extra=[
    {name="Coin, play", options="1 coin 1 play,1 coin 2 plays", bits="0"},
    {name="Back sound in front mix", options="On,Off", bits="8"},
    {name="Louder explosion", options="Off,On", bits="9"},
]

[ROM]
regions=[
    {name="maincpu", skip=true},
    {name="roms", no_offset=true},
]
order=["roms"]
